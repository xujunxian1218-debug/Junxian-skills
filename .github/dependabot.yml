version: 2
updates:
  # 自动更新GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Node/NPM项目，其他技术栈自行替换package-ecosystem
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # 禁止自动升级大版本（Major），规避破坏性变更
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
